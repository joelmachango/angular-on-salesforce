<template>
    <lightning-card title="Account Pulse" icon-name="standard:account">
        <div class="slds-p-horizontal_medium">
            <!-- Step 10: props in. A native Salesforce control drives the Angular app. -->
            <lightning-radio-group
                label="Filter the embedded app"
                type="button"
                options={industryOptions}
                value={industry}
                onchange={handleIndustryChange}>
            </lightning-radio-group>

            <div class="slds-grid slds-gutters slds-m-top_small">
                <div class="slds-col slds-size_2-of-3">
                    <lightning-ui-embedding
                        lwc:ref="embedding"
                        src={appUrl}
                        props={embedProps}
                        width="100%"
                        height="560">
                    </lightning-ui-embedding>
                </div>

                <!-- Step 11: events out. The account picked in Angular, shown with native components. -->
                <div class="slds-col slds-size_1-of-3">
            <template lwc:if={selectedId}>
                <lightning-record-view-form record-id={selectedId} object-api-name="Account">
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">{selectedName}</h2>
                    <lightning-output-field field-name="Industry"></lightning-output-field>
                    <lightning-output-field field-name="AnnualRevenue"></lightning-output-field>
                    <lightning-output-field field-name="OwnerId"></lightning-output-field>
                    <lightning-output-field field-name="LastModifiedDate"></lightning-output-field>
                </lightning-record-view-form>
            </template>
            <template lwc:else>
                <p class="slds-text-color_weak slds-m-top_medium">Pick an account in the app.</p>
            </template>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
