<main class="p-6 space-y-4">
	<header class="flex flex-wrap items-end justify-between gap-2">
		<div>
			<h1 class="text-2xl font-semibold text-gray-900">Account Pulse</h1>
			@if (!loading() && !error()) {
				<p class="text-gray-600">{{ industry() }} · {{ visible().length }} accounts</p>
			}
		</div>
		<p class="text-right" [class.invisible]="loading() || error()">
			<span class="block text-sm text-gray-600">Total annual revenue</span>
			<span class="text-2xl font-semibold text-gray-900">{{ money(total()) }}</span>
		</p>
	</header>

	@if (loading()) {
		<p class="text-gray-600">Loading accounts…</p>
	} @else if (error()) {
		<p role="alert" class="rounded-lg border border-red-200 bg-red-50 p-4 text-red-800">{{ error() }}</p>
	}

	<ul class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3 list-none p-0">
		@for (account of visible(); track account.id) {
			<li>
				<button
					type="button"
					(click)="select(account)"
					class="w-full text-left rounded-lg border border-gray-200 bg-white p-4 hover:border-blue-500 hover:shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
				>
					<span class="block font-medium text-gray-900">{{ account.name }}</span>
					<span class="block text-sm text-gray-600">{{ account.industry }}</span>
					<span class="block text-sm text-gray-900">{{ money(account.revenue) }}</span>
				</button>
			</li>
		}
	</ul>
</main>
